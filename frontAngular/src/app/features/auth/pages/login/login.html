<div class="flex min-h-[80vh] items-center justify-center p-4">
	<div class="border-base-300 bg-base-100 w-full max-w-md rounded-2xl border p-8 shadow-xl">
		<h1 class="text-base-content mb-2 text-center text-4xl font-bold">¡Hola de nuevo!</h1>
		<p class="text-base-content/60 mb-8 text-center text-sm">Introduce tus credenciales para acceder</p>

		<form class="flex flex-col gap-5" [formGroup]="loginForm" (ngSubmit)="onLogin()">
			<div>
				<label class="label-form text-base-content" for="email">Correo electrónico</label>
				<input
					class="input-field"
					id="email"
					[class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
					type="email"
					formControlName="email"
					placeholder="tu@email.com"
				/>
			</div>

			<div>
				<label class="label-form text-base-content" for="password">Contraseña</label>
				<input
					class="input-field"
					id="password"
					[class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
					type="password"
					formControlName="password"
					placeholder="••••••••"
				/>
			</div>

			<button
				class="btn btn-primary group text-primary-content mt-2 h-auto py-3 font-bold"
				[disabled]="loginForm.invalid || isLoading()"
				type="submit"
			>
				@if (isLoading()) {
					<span class="loading loading-spinner"></span>
					<span>Entrando...</span>
				} @else {
					<span class="text-lg">Iniciar sesión</span>
					<svg
						class="h-5 w-5 transition-transform group-hover:translate-x-1"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
					</svg>
				}
			</button>

			<div class="relative my-2">
				<div class="absolute inset-0 flex items-center">
					<span class="border-base-300 w-full border-t"></span>
				</div>
				<div class="relative flex justify-center text-xs uppercase">
					<span class="bg-base-100 text-base-content/40 px-2 font-medium">O bien</span>
				</div>
			</div>

			<a class="btn btn-ghost btn-sm text-primary" routerLink="/auth/forgot-password"> ¿Olvidaste la contraseña? </a>

			<a
				class="btn bg-secondary/10 border-secondary/20 text-secondary-focus hover:bg-secondary hover:text-secondary-content border-2 font-bold transition-all"
				routerLink="/auth/register"
			>
				Crear una cuenta nueva
			</a>
		</form>
	</div>
</div>
