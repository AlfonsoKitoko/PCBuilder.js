<div class="flex min-h-screen flex-col">
	<app-header />
	<main class="grow">
		<router-outlet />
	</main>
	<app-footer />

	@if (modalService.activeModal(); as modalData) {
		@switch (modalData.type) {
			@case ('build') {
				<app-build-modal [data]="modalData" />
			}
			@default {
				<app-confirmation-modal
					[data]="modalData"
					(confirm)="modalService.confirmAction()"
					(cancel)="modalService.cancelAction()"
				/>
			}
		}
	}
</div>
<app-toast />
