<div
	class="modal-backdrop bg-neutral/40 animate-in fade-in fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-md duration-200"
	(click)="onBackdropClick($event)"
>
	<div
		class="animate-in slide-in-from-bottom-4 bg-base-100 border-base-300 w-full max-w-md transform overflow-hidden rounded-2xl border shadow-2xl duration-300"
	>
		<div
			class="bg-base-200/80 border-base-300 dark:bg-base-300/50 flex items-center justify-between border-b px-6 py-4"
		>
			<h3 class="text-primary text-lg font-black tracking-tighter uppercase">{{ data().title }}</h3>
			<button
				class="hover:bg-base-300 rounded-lg p-1 opacity-50 transition-colors hover:opacity-100"
				(click)="cancel.emit()"
			>
				<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
				</svg>
			</button>
		</div>

		<div class="px-8 py-8">
			<p class="text-base-content/80 text-sm leading-relaxed font-medium">
				{{ data().message }}
			</p>
		</div>

		<div
			class="bg-base-200/50 border-base-300 dark:bg-base-300/50 flex flex-col-reverse gap-3 border-t px-6 py-4 sm:flex-row sm:justify-end"
		>
			<button class="btn btn-neutral btn-sm h-10 px-6 text-xs font-bold uppercase" (click)="cancel.emit()">
				{{ data().cancelLabel || 'Cancelar' }}
			</button>

			<button
				class="btn btn-sm h-10 px-8 text-xs font-bold uppercase"
				[ngClass]="{
					'btn-error text-white': data().type === 'danger',
					'btn-primary shadow-primary/20 shadow-lg': data().type !== 'danger',
				}"
				(click)="confirm.emit()"
			>
				{{ data().confirmLabel || 'Confirmar' }}
			</button>
		</div>
	</div>
</div>
